{% extends 'base.html' %}

{% block title %}Verify OTP - HelpDeskPro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved fa-3x text-warning mb-2"></i>
                <h3 class="fw-bold text-white">Enter OTP Code</h3>
                <p class="text-secondary small mb-0">Check your Gmail inbox for your 6-digit code</p>
            </div>

            <form action="{{ url_for('verify_otp') }}" method="POST">
                <div class="mb-4">
                    <label for="otp" class="form-label text-secondary small fw-bold">6-Digit Verification Code</label>
                    <input type="text" id="otp" name="otp" class="form-control text-center fs-3 tracking-widest fw-bold" placeholder="123456" maxlength="6" required autofocus>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 text-dark">
                    <i class="fa-solid fa-check-circle me-2"></i>Verify OTP Code
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
