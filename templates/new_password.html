{% extends 'base.html' %}

{% block title %}Set New Password - HelpDeskPro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock-open fa-3x text-success mb-2"></i>
                <h3 class="fw-bold text-white">Renew Password</h3>
                <p class="text-secondary small mb-0">Set a new password for your account</p>
            </div>

            <form action="{{ url_for('new_password') }}" method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-bold">New Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small fw-bold">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type new password" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">
                    <i class="fa-solid fa-key me-2"></i>Save New Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
