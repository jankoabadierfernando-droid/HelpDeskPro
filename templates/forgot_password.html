{% extends 'base.html' %}

{% block title %}Account Recovery - HelpDeskPro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key fa-3x text-warning mb-2"></i>
                <h3 class="fw-bold text-white">Reset Password</h3>
                <p class="text-secondary small mb-0">Enter your registered email to receive an OTP</p>
            </div>

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label text-secondary small fw-bold">Gmail Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 text-dark">
                    <i class="fa-solid fa-paper-plane me-2"></i>Send Verification Code
                </button>
            </form>

            <div class="text-center pt-2 border-top border-secondary">
                <a href="{{ url_for('login') }}" class="text-secondary text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
